<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>SuperWidget Landing Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header id="header">
        <img id="header-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Freecodecamp-logo.svg/2560px-Freecodecamp-logo.svg.png" alt="SuperWidget Logo" />
        <nav id="nav-bar">
            <a class="nav-link" href="#features">Features</a>
            <a class="nav-link" href="#video-section">Demo</a>
            <a class="nav-link" href="#pricing">Pricing</a>
        </nav>
    </header>

    <section id="features">
        <h2>Amazing Features</h2>
        <p>Lightweight, fast, and customizable. SuperWidget does it all.</p>
    </section>

    <section id="video-section">
        <h2>Product Demo</h2>
        <video id="video" controls src="https://www.w3schools.com/html/mov_bbb.mp4">
        Your browser does not support the video tag.
      </video>
    </section>

    <section id="pricing">
        <h2>Simple Pricing</h2>
        <div class="price-cards">
            <div class="card">
                <h3>Basic</h3>
                <p>Free</p>
            </div>
            <div class="card">
                <h3>Pro</h3>
                <p>$9/month</p>
            </div>
            <div class="card">
                <h3>Enterprise</h3>
                <p>Contact us</p>
            </div>
        </div>
    </section>

    <section id="signup">
        <h2>Stay Updated</h2>
        <form id="form" action="https://www.freecodecamp.com/email-submit">
            <input type="email" id="email" name="email" placeholder="Enter your email" required />
            <input type="submit" id="submit" value="Subscribe" />
        </form>
    </section>
</body>

</html>
